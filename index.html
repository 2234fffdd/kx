<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Credixis AI" />
  <meta name="theme-color" content="#4A3D7D" />
  <link rel="manifest" href="/kx/manifest.json" />
  <title>Credixis AI</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #13151a;
      color: #f3efe8;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: linear-gradient(135deg, #172231, #3b1774, #172c6b);
      z-index: 10;
      transition: opacity 0.25s ease;
    }
    #loader.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(231, 201, 138, 0.25);
      border-top-color: #e7c98a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #statusText {
      font-size: 14px;
      color: #e7c98a;
      font-weight: 600;
    }
    #appFrame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: 0;
      background: #13151a;
    }
  </style>
</head>
<body>
  <div id="loader">
    <div class="spinner"></div>
    <div id="statusText">Вход в Credixis AI…</div>
  </div>
  <iframe id="appFrame" allow="clipboard-read; clipboard-write"></iframe>

  <script>
    try {
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
      }
    } catch (e) {}

    const GIST_API = "https://api.github.com/gists/cf708483ed98fb7aca4182822016f1c7";
    let currentBridge = "";
    const frame = document.getElementById("appFrame");
    const loader = document.getElementById("loader");
    const statusText = document.getElementById("statusText");

    frame.addEventListener("load", () => {
      if (frame.src && frame.src !== "about:blank") {
        loader.classList.add("hidden");
      }
    });

    async function fetchBridgeUrl() {
      const r = await fetch(GIST_API + "?t=" + Date.now(), { cache: "no-store" });
      const j = await r.json();
      const content = (j.files && j.files["kleinanzeigen-reply.user.js"] && j.files["kleinanzeigen-reply.user.js"].content) || "";
      const m = content.match(/const BRIDGE_BASE = "([^"]+)"/);
      return m && m[1] ? m[1] : "";
    }

    async function boot(forceReload = false) {
      try {
        const url = await fetchBridgeUrl();
        if (!url) {
          statusText.textContent = "Ожидание туннеля с Макбука…";
          setTimeout(() => boot(true), 2500);
          return;
        }
        if (url !== currentBridge || forceReload) {
          currentBridge = url;
          frame.src = currentBridge + "/messages";
          setTimeout(() => loader.classList.add("hidden"), 4500);
        }
      } catch (e) {
        statusText.textContent = "Переподключение…";
        setTimeout(() => boot(true), 2500);
      }
    }

    document.addEventListener("visibilitychange", async () => {
      if (document.visibilityState === "visible" && currentBridge) {
        try {
          const r = await fetch(currentBridge + "/health?t=" + Date.now(), { cache: "no-store" });
          const j = await r.json();
          if (!j || !j.ok) throw new Error("dead");
        } catch (e) {
          loader.classList.remove("hidden");
          statusText.textContent = "Обновление сессии…";
          boot(true);
        }
      }
    });

    boot();
  </script>
</body>
</html>
