        html.theme-dark body,
        html.theme-light body {
            background: transparent;
        }
        html.theme-dark #root,
        html.theme-light #root {
            background: transparent !important;
            position: relative;
            z-index: 1;
        }
        html.theme-dark .lg\:hidden.fixed.top-0,
        html.theme-light .lg\:hidden.fixed.top-0 {
            background: var(--chrome) !important;
            backdrop-filter: none !important;
        }

        @media screen and (max-width: 767px) and (orientation: landscape) {
            html[data-device="phone"] #landscape-warning {
                display: flex !important;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 999999;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 2rem;
                color: var(--text);
            }

            html.theme-dark[data-device="phone"] #landscape-warning {
                background: transparent;
            }

            html.theme-light[data-device="phone"] #landscape-warning {
                background: transparent;
            }

            html[data-device="phone"] #landscape-warning svg {
                width: 80px;
                height: 80px;
                animation: rotateDevice 2s ease-in-out infinite;
            }

            @keyframes rotateDevice {
                0%, 100% { transform: rotate(0deg); }
                25% { transform: rotate(-15deg); }
                75% { transform: rotate(15deg); }
            }

            html[data-device="phone"] #root {
                display: none !important;
            }
        }

        @media (max-width: 767px) {
            body {
                overflow: hidden;
                height: 100vh;
            }

            #root {
                height: 100vh;
                overflow: hidden;
            }
