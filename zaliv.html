        @media screen and (orientation: landscape) {
            html[data-device="phone"] #landscape-warning {
                display: flex !important;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 999999;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 2rem;
                color: var(--text);
            }

            html.theme-dark[data-device="phone"] #landscape-warning {
                background: transparent;
            }

            html.theme-light[data-device="phone"] #landscape-warning {
                background: transparent;
            }

            html[data-device="phone"] #landscape-warning svg {
                width: 80px;
                height: 80px;
                animation: rotateDevice 2s ease-in-out infinite;
            }

            @keyframes rotateDevice {
                0%, 100% { transform: rotate(0deg); }
                25% { transform: rotate(-15deg); }
                75% { transform: rotate(15deg); }
            }

            html[data-device="phone"] #root {
                display: none !important;
            }
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            3% { transform: scale(1.06); }
            9% { transform: scale(1); }
            15% { transform: scale(1.06); }
            21% { transform: scale(1); }
            100% { transform: scale(1); }
        }
        .grabber-heartbeat {
            animation: heartbeat 3.5s ease-in-out infinite;
            transform-origin: center;
        }

        @keyframes pkfadein { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pkfadeout { from { opacity: 1; } to { opacity: 0; } }
        @keyframes pkmodalin {
            from { opacity: 0; transform: translateY(0.625rem) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes pkmodalout {
            from { opacity: 1; transform: translateY(0) scale(1); }
            to { opacity: 0; transform: translateY(0.625rem) scale(0.96); }
        }
        .modal-overlay.grabber-anim { animation: pkfadein 0.28s cubic-bezier(0.16, 1, 0.3, 1); }
        .modal-overlay.grabber-anim.closing { animation: pkfadeout 0.2s ease-in forwards; }
        .modal-content.grabber-anim { animation: pkmodalin 0.32s cubic-bezier(0.16, 1, 0.3, 1); will-change: opacity, transform; }
        .modal-content.grabber-anim.closing { animation: pkmodalout 0.2s cubic-bezier(0.4, 0, 1, 1) forwards; }

            animation: none !important;
