        html.theme-dark body,
        html.theme-light body {
            background: transparent;
        }
        html.theme-dark #root,
        html.theme-light #root {
            background: transparent !important;
        }
        html.theme-dark .lg\:hidden.fixed.top-0,
        html.theme-light .lg\:hidden.fixed.top-0,
        html.theme-dark .mobile-tabbar,
        html.theme-light .mobile-tabbar {
            background: var(--chrome) !important;
            backdrop-filter: none !important;
        }

        #root {
            position: relative;
            z-index: 2;
            background: transparent;
            min-height: calc(100vh + env(safe-area-inset-bottom));
        }

        :root {
            color-scheme: light dark;
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes menuSlideIn {
            0% {
                max-height: 0;
                opacity: 0;
            }
            100% {
                max-height: 600px;
                opacity: 1;
            }
        }

        @keyframes menuSlideOut {
            0% {
                max-height: 600px;
                opacity: 1;
            }
            100% {
                max-height: 0;
                opacity: 0;
            }
        }

        .mobile-menu-enter {
            animation: menuSlideIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            overflow: hidden;
        }

        .mobile-menu-exit {
            animation: menuSlideOut 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            overflow: hidden;
    pointer-events: none;
        }

        .menu-item {
            transition: all 0.22s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
        }

        .menu-item.active {
            transform: translateX(8px);
            background: var(--surface-strong) !important;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .menu-item.active::before {
            content: '';
            position: absolute;
            left: -4px;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 60%;
            background: linear-gradient(to bottom, #3b82f6, #1d4ed8);
            border-radius: 2px;
            animation: activeBarSlide 0.22s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        @keyframes activeBarSlide {
            from {
                height: 0%;
                opacity: 0;
            }
            to {
                height: 60%;
                opacity: 1;
            }
        }

        .tab-content {
            animation: none;
        }

        .tab-content.animated {
